# Checks, from outside the server, that Techgist is still publishing: reads the edition the app reads and fails
# (and sends an ntfy alert) when it is stale or unreachable. This is the check that still works when the whole VPS
# is down, which nothing running on the VPS can report.
#
# MANUAL TRIGGER ONLY. The same check runs for real from cron on the old private box every 5 minutes
# (server/deploy/freshness_cron.sh, server/deploy/README.md); this workflow is a second, independent place to run
# it. The schedule below is commented out because it needs a repository secret only the owner can create:
#   1. add the repository secret NTFY_TOPIC (the topic in /etc/techgist/env on the VPS), so a stale edition alerts;
#   2. uncomment the two `schedule` lines.
# The limit is 20 min: since the cutover of 2026-11-16 the worker pushes about every 3 min and GitHub caches for 5.
# GitHub may start scheduled runs 5-15 min late and stops them in a repository with no activity for 60 days.
name: Edition freshness

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL of the published edition.json or health.json
        default: https://raw.githubusercontent.com/pranjaldoshi96/techshorts/edition/edition.json
      max_age_min:
        description: Minutes since the last publish before it counts as stale
        default: "20"
  # schedule:
  #   - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: server/deploy
      - name: Check the published edition's age
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          URL: ${{ inputs.url || 'https://raw.githubusercontent.com/pranjaldoshi96/techshorts/edition/edition.json' }}
          MAX_AGE_MIN: ${{ inputs.max_age_min || '20' }}
        run: python3 server/deploy/check_freshness.py "$URL" --max-age-min "$MAX_AGE_MIN" --alert
