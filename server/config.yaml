# Techgist worker settings (docs/V2_SPEC.md section 2). Sources live in sources.yaml.
# TECHGIST_STATE overrides state_dir, so a test copy can run beside the live publisher.
state_dir: ~/.techshorts
tick_seconds: 60

fetch:
  timeout_s: 15
  parallel: 8
  # Generic, honest UA; feeds that refuse it are left out rather than spoofed.
  user_agent: "Mozilla/5.0 (compatible; TechgistBot/1.0; +https://pranjaldoshi96.github.io/apps/techgist/)"
  # Archive feeds (OpenAI, Hugging Face) list 1,000+ posts; only the newest matter.
  max_items_per_feed: 100
  # Ignored at first sight when older than the longest tab window the item could reach:
  # Dev is 7 d for news, Reads is 14 d for `reads` sources (section 2.12).
  max_age_days: 7
  max_age_days_reads: 14
  # A source's first poll marks older items as seen, so a new source doesn't flood the LLM.
  first_run_skip_hours: 36
  # ntfy alert after this many failed polls in a row (section 7).
  failure_alert_after: 6

# check_sources runs at worker start and then every check_every_hours (the "nightly" check).
check_every_hours: 24

# Any OpenAI-compatible endpoint can be swapped in here without code changes (section 2.1). Models checked against
# the NVIDIA key on 2026-11-11: many listed models return 404/410, so test before changing one.
llm:
  base_url: https://integrate.api.nvidia.com/v1
  model: nvidia/nemotron-3.5-lightning-30b-a3b
  # Third rung of the retry ladder (section 2.8): a larger model gets one try after a failed feedback retry.
  fallback_model: nvidia/nemotron-3-ultra-550b-a55b
  # Chat calls (write + entailment + triage) per rolling 24 h; writing pauses past it.
  daily_budget: 3000
  rate_per_min: 30
  concurrency: 6
  timeout_s: 30
  # Caps one tick's LLM stage at about a minute of the rate limit, so polling isn't starved during a backlog.
  max_items_per_tick: 18
embed:
  # The only embedding model that answered for this key (2048-d); nv-embedqa-e5-v5 and llama-3.2-nv-embedqa
  # return 410. Used from WP3.
  model: nvidia/nemotron-3.5-embed-1b
