# Techgist worker settings (docs/V2_SPEC.md section 2). Sources live in sources.yaml.
# TECHGIST_STATE overrides state_dir, so a test copy can run beside the live publisher.
state_dir: ~/.techshorts
tick_seconds: 60

fetch:
  timeout_s: 15
  parallel: 8
  # Generic, honest UA; feeds that refuse it are left out rather than spoofed.
  user_agent: "Mozilla/5.0 (compatible; TechgistBot/1.0; +https://pranjaldoshi96.github.io/apps/techgist/)"
  # Archive feeds (OpenAI, Hugging Face) list 1,000+ posts; only the newest matter.
  max_items_per_feed: 100
  # Ignored at first sight when older than the longest tab window the item could reach:
  # Dev is 7 d for news, Reads is 14 d for `reads` sources (section 2.12).
  max_age_days: 7
  max_age_days_reads: 14
  # A source's first poll marks older items as seen, so a new source doesn't flood the LLM.
  first_run_skip_hours: 36
  # ntfy alert after this many failed polls in a row (section 7).
  failure_alert_after: 6

# check_sources runs at worker start and then every check_every_hours (the "nightly" check).
check_every_hours: 24

# Chat models. Each provider is an OpenAI-compatible endpoint with its own key, read from the environment variable
# named by key_env or from the file named by <key_env>_FILE (the VPS unit points those at /etc/techgist; a key is
# never in this file, the unit or the journal). A model is "provider:model id".
#   hub     the inference hub: GPT and Gemini, which the owner prefers for what readers see. They are reasoning
#           models: reasoning_effort low keeps a card to a few seconds, and reasoning counts against max_tokens.
#   nvidia  the public NVIDIA endpoint: embeddings (see `embed`), and the backup chat model. Only the two Nemotron
#           models answer reliably there, and only with enable_thinking false.
# Roles, each tested from the VPS on 2026-11-15 (tools/eval_cards.py on the test run's known-bad cards):
#   model         writes cards and event rewrites: headline, summary, push alert, importance and spice.
#   judge_model   fact-checks every card line against the source and rules whether two reports are one development.
#                 A different model family from the writer, so the check does not share the writer's blind spots.
#   triage_model  screens a tick's new titles in one call before any of them costs a full write.
#   backup_model  gets the same call once when the primary's endpoint fails (timeout, 5xx, 429s, bad key).
llm:
  base_url: https://integrate.api.nvidia.com/v1      # embeddings and the per-tick key check
  default_provider: nvidia
  providers:
    hub:
      base_url: https://inference-api.nvidia.com/v1
      key_env: HUB_API_KEY
      rate_per_min: 90
      timeout_s: 60
      params: {reasoning_effort: low}
    nvidia:
      base_url: https://integrate.api.nvidia.com/v1
      key_env: NVIDIA_API_KEY
      rate_per_min: 30
      timeout_s: 30
      params: {chat_template_kwargs: {enable_thinking: false}}
  model: hub:openai/openai/gpt-6.1-sol
  judge_model: hub:gcp/google/gemini-4-argon
  triage_model: hub:gcp/google/gemini-3.8-flash
  # Same-development rulings for clustering (cluster.py). On the test run's Nvidia saga (tools/recluster.py) this
  # model and the fact-checker's agreed on all but one of 44 rulings, at 1.7 s a call against 4.1 s.
  cluster_model: hub:gcp/google/gemini-3.8-flash
  backup_model: nvidia:nvidia/nemotron-3.5-lightning-30b-a3b
  # Third rung of the retry ladder (section 2.8): another model gets one try after a failed feedback retry. Off.
  fallback_model: null
  triage: true
  # Chat calls (screen + write + fact-check + cluster judge) per rolling 24 h; writing pauses past it.
  daily_budget: 12000
  rate_per_min: 30
  concurrency: 12
  # A timeout is not retried, and two in a row open a per-tick circuit for that provider (llm.Client), so a slow
  # endpoint costs a tick one timeout and the backup model takes over.
  timeout_s: 30
  # Caps one tick's LLM stage, so polling isn't starved during a backlog.
  max_items_per_tick: 30
embed:
  # The only embedding model that answered for this key on 2026-11-11; nv-embedqa-e5-v5, llama-3.2-nv-embedqa-1b-v2,
  # llama-nemotron-embed-1b-v2, nv-embed-v1 and bge-m3 return 410. It accepts `dimensions` (Matryoshka).
  model: nvidia/nemotron-3.5-embed-1b
  # Input = original title + the first lead_words words of the item's text; picked with dims by
  # `tools/label_pairs.py --variants` on the labelled fixture pairs. Changing either needs a re-calibration.
  dims: 1024
  lead_words: 120

# Clustering (spec 2.9). Thresholds come from tools/label_pairs.py (WP3a): each is the lowest cosine at which the
# labelled fixture pairs keep precision >= 0.97. Don't hand-tune them; re-run the tool.
cluster:
  t_cand: 0.525
  t_join: 0.47
  t_signal: 0.45
  # An LLM-picked event may join without a shared entity when cosine >= t_join + pick_margin.
  pick_margin: 0.03
  join_max_age_h: 48
  join_max_idle_h: 24
  merge_max_age_h: 6
  alias_days: 30
  max_candidates: 5
  rewrite_cap_h: 2
  # At or above this cosine two texts are the same report; below it (down to t_join) the judge rules whether an
  # item reports the same development as the event (cluster.py).
  t_same: 0.9

# Signals that become cards (fetch.promote_signals): Techmeme and Mediagazer picks always; HN and Lobsters links
# past these points. per_tick caps how many linked articles are imported in one tick.
signals:
  promote: {techmeme: 0, hn: 150, lobsters: 60, max_age_h: 36, per_tick: 10}

# The edition's duplicate guard and storyline grouping (publish_v1, rank.Dedup) compare the headline each card shows,
# embedded as a query. Spec 2.12/8 used T_join for this, but T_join was calibrated for passage vectors plus a shared
# entity; on short headlines it fired on distinct stories ("Workday outage locks millions out" vs "Microsoft
# Outlook hit by new outage" = 0.54) and hid them. From `tools/label_pairs.py --report` on query vectors of the
# labelled fixture titles: t_headline (with a shared non-org entity) 0.49 -> 0.5; cosine alone 0.59 at precision
# 0.97 on the fixture, raised to 0.65 because the shadow run showed a different-angle pair at 0.585. A storyline
# (same-or-related, with an entity) caps a tab at rank.STORYLINE_CAP cards; it only holds cards back, so it uses
# the 0.95-precision point, 0.45. Two cards about the same company (first-named org) with no shared person or amount
# join a storyline at 0.43: on the 2026-11-15 shadow candidates the same-story pairs sat at 0.44-0.65 (three
# Anthropic IPO cards, two Fireworks breach cards, two Amazon shopping-data cards) and the first different-story
# pair at 0.38 (Paytm wallet nod vs Paytm shares).
dedup:
  t_headline: 0.5
  t_headline_alone: 0.65
  t_storyline: 0.45
  t_storyline_org: 0.43

# v1 publish (WP4, spec 2.13). The worker writes edition.json, health.json and img/ into out_dir (default
# <state_dir>/edition; `--out` overrides). base_url is where that directory is served from: image URLs in the edition
# point there. Nothing is pushed until git_remote is set, which happens at cutover (WP5); until then publish.sh
# owns the edition branch.
publish:
  out_dir: null
  base_url: https://raw.githubusercontent.com/pranjaldoshi96/techshorts/edition/
  # Rewritten when the content changes, and at least this often so editionAgeMin stays honest.
  every_min: 5
  git_remote: null              # git@github.com:pranjaldoshi96/techshorts.git at cutover
  git_branch: edition
  git_every_min: 10
  deploy_key: ~/.ssh/techshorts_deploy
# Tab rules are the spec's (worker/rank.py, spec 2.12). Any of min_importance, window_h, tau_h and max can be
# overridden per tab here, e.g. `tabs: {reads: {min_importance: 4}}`. Note: the LLM rates essays 4 (the 2.6
# anchors put strong analysis at 4-5), so with the spec's Reads minimum of 5, Reads (1.2's Blogs tab) is nearly
# empty; that is the lead's call, so the spec value stands until changed here.
# Reads at 4: with the spec's 5 the Blogs tab was empty in the shadow run (essays are rated 4).
tabs: {reads: {min_importance: 4}}
images:
  # Source pictures downloaded per tick (best-ranked events first); the rest get theirs on later ticks.
  max_downloads_per_tick: 60
