# Techgist worker settings (docs/V2_SPEC.md section 2). Sources live in sources.yaml.
# TECHGIST_STATE overrides state_dir, so a test copy can run beside the live publisher.
state_dir: ~/.techshorts
tick_seconds: 60

fetch:
  timeout_s: 15
  parallel: 8
  # Generic, honest UA; feeds that refuse it are left out rather than spoofed.
  user_agent: "Mozilla/5.0 (compatible; TechgistBot/1.0; +https://pranjaldoshi96.github.io/apps/techgist/)"
  # Archive feeds (OpenAI, Hugging Face) list 1,000+ posts; only the newest matter.
  max_items_per_feed: 100
  # Ignored at first sight when older than the longest tab window the item could reach:
  # Dev is 7 d for news, Reads is 14 d for `reads` sources (section 2.12).
  max_age_days: 7
  max_age_days_reads: 14
  # A source's first poll marks older items as seen, so a new source doesn't flood the LLM.
  first_run_skip_hours: 36
  # ntfy alert after this many failed polls in a row (section 7).
  failure_alert_after: 6

# check_sources runs at worker start and then every check_every_hours (the "nightly" check).
check_every_hours: 24

# Any OpenAI-compatible endpoint can be swapped in here without code changes (section 2.1). Models checked against
# the NVIDIA key on 2026-11-11: many listed models return 404/410, so test before changing one.
llm:
  base_url: https://integrate.api.nvidia.com/v1
  model: nvidia/nemotron-3.5-lightning-30b-a3b
  # Third rung of the retry ladder (section 2.8): a larger model gets one try after a failed feedback retry.
  fallback_model: nvidia/nemotron-3-ultra-550b-a55b
  # Chat calls (write + entailment + triage) per rolling 24 h; writing pauses past it.
  daily_budget: 3000
  rate_per_min: 30
  concurrency: 6
  timeout_s: 30
  # Caps one tick's LLM stage at about a minute of the rate limit, so polling isn't starved during a backlog.
  max_items_per_tick: 18
embed:
  # The only embedding model that answered for this key on 2026-11-11; nv-embedqa-e5-v5, llama-3.2-nv-embedqa-1b-v2,
  # llama-nemotron-embed-1b-v2, nv-embed-v1 and bge-m3 return 410. It accepts `dimensions` (Matryoshka).
  model: nvidia/nemotron-3.5-embed-1b
  # Input = original title + the first lead_words words of the item's text; picked with dims by
  # `tools/label_pairs.py --variants` on the labelled fixture pairs. Changing either needs a re-calibration.
  dims: 1024
  lead_words: 120

# Clustering (spec 2.9). Thresholds come from tools/label_pairs.py (WP3a): each is the lowest cosine at which the
# labelled fixture pairs keep precision >= 0.97. Don't hand-tune them; re-run the tool.
cluster:
  t_cand: 0.525
  t_join: 0.47
  t_signal: 0.45
  # An LLM-picked event may join without a shared entity when cosine >= t_join + pick_margin.
  pick_margin: 0.03
  join_max_age_h: 48
  join_max_idle_h: 24
  merge_max_age_h: 6
  alias_days: 30
  max_candidates: 5
  rewrite_cap_h: 2

# v1 publish (WP4, spec 2.13). The worker writes edition.json, health.json and img/ into out_dir (default
# <state_dir>/edition; `--out` overrides). base_url is where that directory is served from: image URLs in the edition
# point there. Nothing is pushed until git_remote is set, which happens at cutover (WP5); until then publish.sh
# owns the edition branch.
publish:
  out_dir: null
  base_url: https://raw.githubusercontent.com/pranjaldoshi96/techshorts/edition/
  # Rewritten when the content changes, and at least this often so editionAgeMin stays honest.
  every_min: 5
  git_remote: null              # git@github.com:pranjaldoshi96/techshorts.git at cutover
  git_branch: edition
  git_every_min: 10
  deploy_key: ~/.ssh/techshorts_deploy
images:
  # Source pictures downloaded per tick (best-ranked events first); the rest get theirs on later ticks.
  max_downloads_per_tick: 60
