# The single source list (docs/V2_SPEC.md section 2.2). Every URL here returned 200 with items from the
# server on 2026-11-11 using the worker's generic UA; tools/check_sources.py re-checks them at start and daily,
# and a source that fails it loses tier-1 status until it passes again.
#
# Fields: id, name, v1_name (exact 1.2 FeedSource name, or `name` for new sources), url,
# tier (1 | 2 | signal), authority (0.5-1.2), reads, region (in | us | global), poll (3m | 10m),
# fetch_page, images (source | generated). Optional: include_tags (keep only entries with one of these
# feed categories, for site-wide feeds); format (rss | hn_algolia | lobsters); kind (techmeme | hn | lobsters,
# what a signal source is); seed_days (how far back the first poll reaches, for essays and developer posts;
# default fetch.first_run_skip_hours); domains (hosts whose articles are this publisher's, for an article imported from a
# Techmeme or Hacker News link). A source with domains and no url is never polled: it only names the publisher.
#
# Scope (the owner's direction, 2026-11-15): anything with a tech angle that makes a good headline, so the list
# includes the business press, leak- and gossip-driven outlets, security, gaming, crypto, space and EV desks and
# regulators, not only trade press. General feeds carry much that is not tech: one screening call per tick
# (llm.triage_batch) drops it before it costs a write. The sources added on 2026-11-15 each returned 200 with
# items from the VPS with the worker's UA that day.
#
# Left out because they fail from the server today: Moneycontrol Tech (403 to a non-browser UA),
# ETtech's own site (tech.economictimes.indiatimes.com times out; the ET Tech section feed below works),
# Anthropic's site (no RSS; a community-built mirror is used instead), Reddit (429/403 to the VPS, so r/technology
# is not a traction signal yet), VentureBeat and Pirate Wires (429), Techdirt, AP, the FTC and SEC litigation feeds
# and Business Standard (403), Reuters (no public feed; its articles still arrive through Techmeme links).

defaults:
  tier: 2
  authority: 1.0
  reads: false
  region: global
  poll: 10m
  fetch_page: true
  images: source

domain_blocklist: []

